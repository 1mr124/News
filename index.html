<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>News Monitor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#0e0f12; --panel:#16181d; --panel2:#1c1f26; --text:#e9e9ee;
    --muted:#9aa0ab; --accent:#3ea6ff; --active:#22252c; --border:#262a33;
  }
  *{box-sizing:border-box}
  /* .channel sets display:flex explicitly, which otherwise beats the browser's
     built-in [hidden]{display:none} UA rule (author styles always win over UA
     styles regardless of specificity) — without this, toggling .hidden on a
     channel row via JS has no visual effect. */
  [hidden]{display:none!important}
  html,body{height:100%}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);
       display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
  header h1{font-size:18px;margin:0;font-weight:600}
  header small{color:var(--muted)}
  .hdrbtn{background:none;border:1px solid var(--border);color:var(--muted);font-size:12px;padding:5px 10px;border-radius:6px;cursor:pointer}
  .hdrbtn:hover{color:var(--text);border-color:var(--accent)}
  .badge.live{background:#1a3a24;color:#4ade80}
  .badge.offline{background:#2a2c32;color:var(--muted)}
  .badge.manual{background:#3a2f16;color:#f0b429}
  .badge.auto{background:#16283a;color:#60a5fa}
  .badge.error{background:#3a1616;color:#f87171}
  .badge.blocked{background:#3a2f16;color:#f0b429}
  .badge.soon{background:#16283a;color:#60a5fa}
  .badge.recent{background:#23262d;color:#9aa0ab}
  .layout{display:flex;flex:1;min-height:0;position:relative}
  nav{width:300px;background:var(--panel);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;
      transition:width .28s cubic-bezier(.4,0,.2,1),opacity .2s ease;position:relative}
  nav.collapsed{width:0;opacity:0;border-right:none;overflow:hidden}
  .navsearch{position:sticky;top:0;z-index:2;background:var(--panel);padding:10px 12px;border-bottom:1px solid var(--border)}
  .navsearch input{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);
    padding:8px 10px;border-radius:6px;font-size:13px}
  .navsearch input:focus{outline:none;border-color:var(--accent)}
  .no-results{padding:16px;color:var(--muted);font-size:13px;text-align:center}
  .navtoggle{
    position:absolute;top:14px;left:300px;z-index:5;
    width:26px;height:44px;display:flex;align-items:center;justify-content:center;
    background:var(--panel2);border:1px solid var(--border);border-left:none;
    border-radius:0 8px 8px 0;cursor:pointer;color:var(--muted);
    transition:left .28s cubic-bezier(.4,0,.2,1),background .15s,color .15s;
  }
  .navtoggle:hover{background:var(--active);color:var(--text)}
  .navtoggle.collapsed{left:0;border-radius:0 8px 8px 0}
  .navtoggle svg{width:14px;height:14px;transition:transform .28s cubic-bezier(.4,0,.2,1)}
  .navtoggle.collapsed svg{transform:rotate(180deg)}
  .navtoggle.mobile{display:none}
  .category-title{padding:14px 16px 5px;font-size:11px;font-weight:700;text-transform:uppercase;
    letter-spacing:.09em;color:var(--text);border-top:1px solid var(--border)}
  .category-title:first-child{border-top:none}
  .group-title{padding:12px 16px 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
    position:sticky;top:var(--navsearch-h,54px);background:var(--panel);z-index:1}
  .channel{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;cursor:pointer;border-left:3px solid transparent}
  .channel:hover{background:var(--panel2)}
  .channel.active{background:var(--active);border-left-color:var(--accent)}
  .channel .name{font-size:14px}
  .channel .name small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
  .channel[dir="rtl"] .name{text-align:right}
  .badge{font-size:10px;padding:2px 6px;border-radius:10px;background:#3a2f16;color:#f0b429;flex-shrink:0}
  .badge.ok{background:#1a3a24;color:#4ade80}
  .fixbtn{background:none;border:1px solid var(--border);color:var(--muted);font-size:11px;padding:3px 7px;border-radius:6px;cursor:pointer;flex-shrink:0}
  .fixbtn:hover{color:var(--text);border-color:var(--accent)}
  .navbackdrop{display:none}
  main{flex:1;display:flex;flex-direction:column;background:#000}
  .player-wrap{flex:1;position:relative}
  .player-wrap iframe{width:100%;height:100%;border:0;display:block}
  .hint{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(20,20,24,.92);border:1px solid var(--border);
        border-radius:8px;padding:10px 14px;font-size:13px;color:var(--muted);transition:opacity .6s ease}
  .hint a{color:var(--accent);margin-left:8px;text-decoration:none}
  .hint a:hover{text-decoration:underline}
  .hint.fade{opacity:0;pointer-events:none}
  .empty{color:var(--muted);display:flex;align-items:center;justify-content:center;height:100%;font-size:14px;text-align:center;padding:40px}
  .toolbar{padding:8px 14px;background:var(--panel);border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;font-size:13px;flex-shrink:0}
  .toolbar a{color:var(--accent);text-decoration:none}
  .toolbar a:hover{text-decoration:underline}
  .toolbar-spacer{flex:1}
  .linkbtn{background:none;border:none;color:var(--muted);font:inherit;font-size:12px;cursor:pointer;padding:2px 4px;text-decoration:underline;text-underline-offset:2px}
  .linkbtn:hover{color:var(--text)}

  /* ===== Live-status strip + recent-videos grid + manual popover =========
     Uses only the existing :root tokens — no new visual language. */
  .livestrip{display:flex;align-items:center;gap:8px;padding:7px 14px;background:var(--panel);
    border-bottom:1px solid var(--border);font-size:12.5px;color:var(--muted);flex-shrink:0}
  .livestrip .dot{width:8px;height:8px;border-radius:50%;background:#4ade80;flex-shrink:0;
    box-shadow:0 0 0 3px rgba(74,222,128,.18)}
  .livestrip.live{color:#4ade80}
  .livestrip.blocked{color:#f0b429}
  .livestrip.blocked .dot{background:#f0b429;box-shadow:0 0 0 3px rgba(240,180,41,.18)}
  .livestrip.soon{color:#60a5fa}
  .livestrip.soon .dot{background:#60a5fa;box-shadow:none}
  .livestrip.plain .dot{background:var(--muted);box-shadow:none}

  /* When a recent grid is shown the main column scrolls and the player takes a
     bounded (but still dominant) height instead of all remaining space. */
  main#mainCol.has-recent{overflow-y:auto}
  main#mainCol.has-recent .player-wrap{flex:0 0 auto;height:min(62vh,56.25vw);min-height:240px}
  .recent-grid{display:grid;gap:10px;padding:12px 14px;background:var(--panel);
    border-top:1px solid var(--border);
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
  .rv-card{display:flex;flex-direction:column;gap:6px;padding:0;background:var(--panel2);
    border:1px solid var(--border);border-radius:8px;overflow:hidden;cursor:pointer;
    color:var(--text);font:inherit;text-align:left}
  .rv-card:hover{border-color:var(--accent)}
  .rv-card[aria-current="true"]{border-color:var(--accent);background:var(--active)}
  .rv-thumb{position:relative;width:100%;aspect-ratio:16/9;background:#000}
  .rv-thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .rv-tag{position:absolute;left:6px;top:6px;font-size:10px;padding:2px 6px;border-radius:10px;
    background:rgba(20,20,24,.85);color:#4ade80}
  .rv-title{font-size:12px;line-height:1.35;color:var(--text);padding:0 8px 9px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .recent-empty{color:var(--muted);font-size:13px;padding:16px 4px}

  .mpop-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
  .mpop{position:fixed;z-index:41;width:min(420px,calc(100vw - 32px));
    background:var(--panel2);border:1px solid var(--border);border-radius:10px;
    padding:14px;box-shadow:0 12px 40px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:10px}
  .mpop-title{font-size:14px;font-weight:600}
  .mpop-sub{font-size:12px;color:var(--muted);margin-top:-4px}
  .mpop input{width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);
    padding:9px 10px;border-radius:6px;font-size:13px}
  .mpop input:focus{outline:none;border-color:var(--accent)}
  .mpop-err{color:#f87171;font-size:12px}
  .mpop-row{display:flex;align-items:center;gap:8px}
  /* Add Channel dialog reuses the .mpop popover pattern; the preview block
     below shows the resolved channel before confirming. */
  .aprev{display:flex;align-items:center;gap:10px;background:var(--panel);
    border:1px solid var(--border);border-radius:8px;padding:9px 10px}
  .aprev img{width:44px;height:44px;border-radius:50%;object-fit:cover;flex-shrink:0;background:#000}
  .aprev-name{font-size:13.5px;font-weight:600;overflow-wrap:anywhere}
  .aprev-sub{font-size:11.5px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
  .aprev-dup{font-size:12px;color:#f0b429;background:rgba(240,180,41,.09);
    border:1px solid rgba(240,180,41,.28);border-radius:6px;padding:7px 10px;line-height:1.4}
  .rmbtn{background:none;border:none;color:var(--muted);font-size:13px;padding:3px 5px;border-radius:6px;cursor:pointer;flex-shrink:0}
  .rmbtn:hover{color:#f87171}

  ::-webkit-scrollbar{width:8px}
  ::-webkit-scrollbar-thumb{background:#333;border-radius:4px}

  @media (max-width:720px){
    header{padding:10px 12px;flex-wrap:wrap;row-gap:6px}
    header h1{font-size:16px}
    .hdrbtn{padding:7px 10px}
    .navtoggle{display:none}
    .navtoggle.mobile{
      display:flex;position:static;width:32px;height:32px;border-radius:6px;flex-shrink:0;
    }
    nav{
      position:fixed;top:0;bottom:0;left:0;width:85%;max-width:340px;z-index:20;
      transform:translateX(0);transition:transform .28s ease;box-shadow:2px 0 16px rgba(0,0,0,.5);
    }
    nav.collapsed{transform:translateX(-100%);width:85%;max-width:340px;opacity:1;border-right:1px solid var(--border)}
    .navbackdrop.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:15}
    .channel{padding:13px 16px}
    .fixbtn{padding:6px 10px;font-size:12px}
    .toolbar{flex-wrap:wrap;row-gap:6px}
    .toolbar-spacer{flex-basis:100%;height:0}
    main#mainCol.has-recent .player-wrap{height:min(52vh,56.25vw);min-height:200px}
    .recent-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;padding:10px}
    .rv-title{font-size:11.5px}
    .mpop input{padding:11px 12px;font-size:16px}   /* 16px avoids iOS zoom-on-focus */
  }

  /* ===== Liveuamap Explorer ("World Map" tab) ============================
     Uses only the existing :root design tokens — no new visual language. */
  .tabs{display:flex;gap:6px;padding:8px 20px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0}
  .tab{background:none;border:1px solid var(--border);color:var(--muted);font:inherit;font-size:13px;
    padding:6px 14px;border-radius:6px;cursor:pointer}
  .tab:hover{color:var(--text);border-color:var(--accent)}
  .tab.active{color:var(--text);background:var(--active);border-color:var(--accent)}

  #liveuamapView,#googleNewsView{display:flex;flex:1;min-height:0;overflow:hidden;position:relative}
  .lu-side{width:300px;background:var(--panel);border-right:1px solid var(--border);flex-shrink:0;
    display:flex;flex-direction:column;min-height:0;
    transition:width .28s cubic-bezier(.4,0,.2,1),opacity .2s ease}

  /* Collapse toggle for the left panel — mirrors the Channels .navtoggle chevron
     so the map can take the full width (desktop) / full viewport (mobile). */
  .lu-toggle{
    position:absolute;top:50%;left:300px;z-index:5;transform:translateY(-50%);
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:26px;height:44px;padding:0;
    background:var(--panel2);border:1px solid var(--border);border-left:none;
    border-radius:0 8px 8px 0;cursor:pointer;color:var(--muted);font:inherit;font-size:13px;
    transition:left .28s cubic-bezier(.4,0,.2,1),background .15s,color .15s;
  }
  .lu-toggle:hover{background:var(--active);color:var(--text)}
  .lu-toggle svg{width:14px;height:14px;flex-shrink:0;transition:transform .28s cubic-bezier(.4,0,.2,1)}
  .lu-toggle-label{display:none}
  #liveuamapView.lu-collapsed .lu-side,#googleNewsView.lu-collapsed .lu-side{width:0;opacity:0;border-right:none;overflow:hidden;pointer-events:none}
  #liveuamapView.lu-collapsed .lu-toggle,#googleNewsView.lu-collapsed .lu-toggle{left:0}
  #liveuamapView.lu-collapsed .lu-toggle svg,#googleNewsView.lu-collapsed .lu-toggle svg{transform:rotate(180deg)}
  .lu-searchbox{padding:10px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
  .lu-searchbox input{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);
    padding:8px 10px;border-radius:6px;font-size:13px}
  .lu-searchbox input:focus{outline:none;border-color:var(--accent)}
  .lu-scroll{overflow-y:auto;overflow-x:hidden;flex:1;min-height:0}
  .lu-section{padding:12px 12px 4px}
  .lu-section-title{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px}
  .lu-hint{font-size:12px;color:var(--muted);line-height:1.5;padding:0 4px 8px}
  .lu-chips{display:flex;flex-wrap:wrap;gap:6px}
  .lu-chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--border);
    color:var(--text);font:inherit;font-size:12px;padding:5px 10px;border-radius:14px;cursor:pointer;
    max-width:100%;text-align:left;white-space:normal;overflow-wrap:anywhere}
  .lu-chip:hover{border-color:var(--accent)}
  .lu-chip.active{background:var(--active);border-color:var(--accent)}
  .lu-chip-x{color:var(--muted);font-size:14px;line-height:1;padding:0 2px;border-radius:8px}
  .lu-chip-x:hover{color:var(--text)}
  .lu-results{padding:4px 0}
  .lu-result{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;border-left:3px solid transparent}
  .lu-result:hover,.lu-result.hl{background:var(--panel2)}
  .lu-result.hl{border-left-color:var(--accent)}
  .lu-result.active{background:var(--active)}
  .lu-result-flag{font-size:15px;flex-shrink:0;width:20px;text-align:center}
  .lu-result-name{font-size:14px;min-width:0;overflow-wrap:anywhere}

  .lu-mapwrap{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:#000}
  .lu-bar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);
    border-bottom:1px solid var(--border);font-size:13px;flex-wrap:wrap;min-width:0}
  .lu-current{color:var(--text)}
  .lu-bar-spacer{flex:1}
  .lu-lang{background:var(--panel);font-family:inherit;line-height:1.4}
  .lu-lang:hover{color:var(--text);border-color:var(--accent)}
  .lu-pin.on{color:#f0b429;border-color:#f0b429}
  .lu-frame{flex:1;position:relative;min-height:0}
  .lu-iframe{width:100%;height:100%;border:0;display:block;background:#000}
  .lu-loading{position:absolute;inset:0}
  .lu-fallback strong{color:var(--text);font-size:15px}
  .lu-fallback-msg{margin:12px 0;color:var(--muted);max-width:420px}
  .lu-fallback-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

  /* Google News tab: the left-panel Language/Topic/custom-search fields, and
     the "launch panel" that stands in for an embed (Google News blocks framing). */
  .gn-field{margin-bottom:12px}
  .gn-field:last-child{margin-bottom:0}
  .gn-field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:5px}
  .gn-select{width:100%;background:var(--panel);font-family:inherit;line-height:1.4}
  .gn-select:hover{color:var(--text);border-color:var(--accent)}
  .gn-query{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);
    padding:8px 10px;border-radius:6px;font-size:13px}
  .gn-query:focus{outline:none;border-color:var(--accent)}
  .gn-panel{flex-direction:column;gap:10px;max-width:560px;margin:0 auto}
  .gn-panel-head{display:flex;align-items:center;gap:10px}
  .gn-panel-head strong{color:var(--text);font-size:17px}
  .gn-panel-flag{font-size:30px;line-height:1}
  .gn-panel-sub{color:var(--muted);font-size:13px}
  .gn-url{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:var(--muted);
    background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:8px 10px;
    max-width:100%;overflow-wrap:anywhere;-webkit-user-select:all;user-select:all}
  .gn-panel-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:2px}
  .gn-go{color:var(--text);border-color:var(--accent);padding:9px 16px;font-size:13px}
  .gn-go:hover{background:var(--active)}
  .gn-panel-note{color:var(--muted);font-size:12px}
  .gn-edition-note{font-size:12px;color:#e7b95a;background:rgba(231,185,90,.09);
    border:1px solid rgba(231,185,90,.28);border-radius:6px;padding:7px 10px;line-height:1.4}

  /* Liveuamap is search + chips + an embedded map, not a video grid — on small
     screens it becomes one vertically-scrolling column (chips at natural height,
     then a viewport-relative map) rather than the Channels drawer layout.
     Breakpoint is 768px (not the Channels view's 720px) so tablet portrait gets
     the stacked layout too; the two queries target different selectors. */
  @media (max-width:768px){
    .tabs{padding:8px 12px}

    #liveuamapView,#googleNewsView{flex-direction:column;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}

    .lu-side{width:auto;flex:0 0 auto;border-right:none;border-bottom:1px solid var(--border);
      min-height:0;max-height:none}
    .lu-scroll{overflow:visible;flex:0 0 auto}          /* the page scrolls, not this box */

    /* Toggle becomes a full-width sticky "Hide list / Show list" bar above the
       panel; collapsing drops the panel so the map fills the fixed-height view. */
    .lu-toggle{
      position:sticky;top:0;left:auto;order:-1;transform:none;
      width:100%;height:auto;min-height:44px;
      border:none;border-bottom:1px solid var(--border);border-radius:0;
      background:var(--panel);z-index:6;
    }
    .lu-toggle-label{display:inline}
    .lu-side{order:0}
    .lu-mapwrap{order:1}
    #liveuamapView.lu-collapsed .lu-side,#googleNewsView.lu-collapsed .lu-side{display:none}
    /* "Hide list" on mobile also drops the map's info bar (Currently viewing /
       language / Reset / Open in new tab) so the embed fills the whole area under
       the sticky "Show list" toggle. App header + tabs stay; desktop is unchanged. */
    #liveuamapView.lu-collapsed .lu-bar,#googleNewsView.lu-collapsed .lu-bar{display:none}
    #liveuamapView.lu-collapsed,#googleNewsView.lu-collapsed{overflow:hidden}
    #liveuamapView.lu-collapsed .lu-mapwrap,#googleNewsView.lu-collapsed .lu-mapwrap{flex:1 1 auto;min-height:0}
    #liveuamapView.lu-collapsed .lu-frame,#googleNewsView.lu-collapsed .lu-frame{flex:1;height:auto;min-height:0}

    .lu-searchbox input{padding:11px 12px;font-size:16px} /* 16px avoids iOS zoom-on-focus */
    .gn-query{padding:11px 12px;font-size:16px}
    .gn-select{min-height:44px}
    .lu-section{padding:14px 14px 6px}
    .lu-chips{gap:8px}
    .lu-chip{padding:9px 13px;font-size:13px;border-radius:16px;min-height:40px}
    .lu-chip-x{font-size:18px;min-width:28px;min-height:28px;
      display:inline-flex;align-items:center;justify-content:center;margin:-4px -6px -4px 0}
    .lu-result{padding:13px 16px;gap:12px;min-height:48px}
    .lu-result-name{font-size:15px}
    .lu-results{max-height:55vh;overflow-y:auto}         /* a long match list can't bury the map */

    .lu-bar{padding:10px 12px;gap:8px}
    .lu-bar-spacer{display:none}
    .lu-current{flex:1 1 100%}
    .lu-bar .hdrbtn{padding:9px 12px;font-size:13px;min-height:40px}

    .lu-mapwrap{flex:0 0 auto;min-height:0}
    .lu-frame{height:70vh;min-height:360px;flex:0 0 auto}

    .lu-fallback-actions{width:100%}
    .lu-fallback-actions .hdrbtn{min-height:40px;padding:9px 12px}
  }
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:10px">
    <button class="navtoggle mobile" id="navToggleMobile" title="Toggle channel list" aria-label="Toggle channel list">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="17" x2="20" y2="17"></line></svg>
    </button>
    <h1>News Monitor</h1>
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <small id="statusline"></small>
    <button class="hdrbtn" id="addChannelBtn" title="Add a YouTube news channel to your list">+ Add Channel</button>

// ---------------------------------------------------------------
// Small in-memory-cached localStorage stores. Avoids re-parsing the
// same JSON blob from localStorage on every single get() call — with
// ~70 channels, render()/badge lookups were doing 3 parses per channel
// per render before this.
// ---------------------------------------------------------------
function createStore(key){
  let cache = null;
  function load(){
    if(cache) return cache;
    try{ cache = JSON.parse(localStorage.getItem(key)) || {}; }catch(e){ cache = {}; }
    return cache;
  }
  function save(obj){
    cache = obj;
    localStorage.setItem(key, JSON.stringify(obj));
  }
  return {
    load, save,
    get(k){ return load()[k]; },
    set(k, v){ const obj = load(); obj[k] = v; save(obj); },
    remove(k){ const obj = load(); delete obj[k]; save(obj); },
  };
}
const customIdStore = createStore(STORAGE_KEY);
const videoIdStore = createStore(VIDEO_STORAGE_KEY);
const metaStore = createStore(META_KEY);
const blockedVideoStore = createStore(BLOCKED_KEY);

// ---------------------------------------------------------------
// User-added channels ("+ Add Channel").
//
// Built-in CHANNELS above is compile-time static config and is never mutated.
// User rows persist as an array in localStorage under USER_CHANNELS_KEY and
// are merged in memory via getAllChannels(), so every existing flow
// (resolve/discover/classify/render/filter/badges/manual override) treats
// them exactly like built-ins. Shape is validated by YTC.isUserChannel()
// both on load (sanitize) and on insert.
// ---------------------------------------------------------------
const USER_CHANNELS_KEY = "newstv_user_channels_v1";
const USER_CHANNEL_GROUP = "My Channels";
function loadUserChannels(){
  let raw = null;
  try{ raw = localStorage.getItem(USER_CHANNELS_KEY); }catch(e){ return []; }
  if(raw === null) return [];
  try{ return YTC.sanitizeUserChannels(JSON.parse(raw)); }catch(e){ return []; }
}
function saveUserChannels(arr){
  try{ localStorage.setItem(USER_CHANNELS_KEY, JSON.stringify(arr || [])); }catch(e){}
}
function getAllChannels(){ return CHANNELS.concat(loadUserChannels()); }
function isUserAdded(ch){ return !!(ch && ch.userAdded); }
function findChannelByHandle(handle){
  const norm = String(handle || "").toLowerCase();
  return getAllChannels().find(c => String(c.handle || "").toLowerCase() === norm) || null;
}

function getApiKey(){ return (window.YOUTUBE_API_KEY && window.YOUTUBE_API_KEY.trim()) || localStorage.getItem(API_KEY_STORAGE) || ""; }
function apiKeyFromConfig(){ return !!(window.YOUTUBE_API_KEY && window.YOUTUBE_API_KEY.trim()); }

function getId(ch){ return ch.id || customIdStore.get(ch.handle) || null; }
// Manual override: a user-set localStorage entry wins; a `manualLiveVideo`
// field in the CHANNELS config is the source-level fallback. null -> use auto.
function getManualVideo(ch){
  return videoIdStore.get(ch.handle) || (ch.manualLiveVideo ? String(ch.manualLiveVideo) : null);
}
function getMeta(ch){ return metaStore.get(ch.handle) || null; }
function getRegion(){ try{ return (localStorage.getItem(REGION_KEY) || "").trim().toUpperCase() || null; }catch(e){ return null; } }
function isBlocked(id){ return id ? !!blockedVideoStore.get(id) : false; }
function markBlocked(id, reason){ if(id) blockedVideoStore.set(id, reason || "blocked"); }
function clearBlockedFor(ids){ (ids || []).forEach(id => { if(id) blockedVideoStore.remove(id); }); }

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }
function chunk(arr, size){
  const out = [];
  for(let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
  return out;
}

// Accepts a full YouTube URL (watch, embed, share, youtu.be, /live/, /shorts/)
// or a bare 11-char video ID. Delegates to the pure module.
function extractVideoId(input){ return YTC.extractVideoId(input); }

// ---------------------------------------------------------------
// YouTube Data API v3.
//
// Quota-saving strategy (this is the expensive part of this app):
//   channels.list?forHandle  -> resolve @handle to UC… id   (1 unit, cached forever)
//   playlistItems.list       -> a channel's ~15 newest uploads (1 unit)
//   videos.list              -> classify up to 50 ids at once (1 unit)
//   search.list?eventType=live -> discover a live not yet in uploads (100 units)
//
// The live search index is eventually-consistent and regularly MISSES a
// stream that is genuinely on air (seen with Sky News, CNN). So discovery
// leans on the uploads playlist — an active live shows up there as the
// newest item — and only falls back to the 100-unit search on a single
// channel click when the cheap scan finds nothing live. A full ~70-channel
// "Fetch All" is now ~2 units/channel (~150 total) instead of ~7,000.
// ---------------------------------------------------------------
let quotaExceeded = false;
let apiKeyInvalid = false;

function nextMidnightPacificMs(){
  const now = new Date();
  const la = new Date(now.toLocaleString("en-US", { timeZone: "America/Los_Angeles" }));
  const nextMidnightLA = new Date(la.getFullYear(), la.getMonth(), la.getDate() + 1, 0, 0, 0, 0);
  return now.getTime() + (nextMidnightLA - la);
}

function markQuotaExceeded(){
  quotaExceeded = true;
  localStorage.setItem(QUOTA_RESET_KEY, String(nextMidnightPacificMs()));
}

function isQuotaExceeded(){
  if(quotaExceeded) return true;
  const resetAt = Number(localStorage.getItem(QUOTA_RESET_KEY) || 0);
  if(Date.now() < resetAt){ quotaExceeded = true; return true; }
  return false;
}

function isApiKeyInvalid(){ return apiKeyInvalid; }

// A bad/typo'd key fails every single request the same way a full-list refresh
// would fail 70 times over — detect it once and short-circuit, same as quota.
function isKeyInvalidError(error){
  const reasons = (error.errors || []).map(e => e.reason);
  return reasons.includes("keyInvalid") || reasons.includes("badRequest") || reasons.includes("API_KEY_INVALID");
}

// Only a genuine DAILY quota exhaustion should disable the app until midnight
// Pacific. A short-term rate limit (HTTP 429, reason rateLimitExceeded /
// userRateLimitExceeded) is transient — fail that request soft and move on,
// otherwise one burst would silently kill discovery for the rest of the day.
function isDailyQuotaError(error){
  const reasons = (error.errors || []).map(e => e.reason);
  return reasons.includes("quotaExceeded") || reasons.includes("dailyLimitExceeded");
}

async function ytApiGet(url){
  try{
    const res = await fetch(url);
    const data = await res.json().catch(() => ({}));
    if(data.error){
      const code = data.error.code;
      if(code === 403 && isDailyQuotaError(data.error)) markQuotaExceeded();
      else if(code === 400 && isKeyInvalidError(data.error)) apiKeyInvalid = true;
      return null; // 429 / rate-limit / transient 5xx fall through here as a soft failure
    }
    if(!res.ok) return null;
    return data;
  }catch(e){
    return null;
  }
}

async function resolveChannelId(ch){
  const existing = getId(ch);
  if(existing) return existing;
  const key = getApiKey();
  if(!key) return null;
  const data = await ytApiGet(`https://www.googleapis.com/youtube/v3/channels?part=id&forHandle=${encodeURIComponent(ch.handle)}&key=${key}`);
  if(!data) return null;
  const id = data.items && data.items[0] && data.items[0].id;
  if(id) customIdStore.set(ch.handle, id);
  return id || null;
}

// --- raw API calls (each returns null on hard failure) ------------------

// playlistItems on the channel's uploads playlist (UC… -> UU…). 1 unit.
async function fetchUploadIds(channelId){
  const key = getApiKey();
  const plId = YTC.uploadsPlaylistId(channelId);
  if(!key || !plId) return null;
  const data = await ytApiGet(`https://www.googleapis.com/youtube/v3/playlistItems?part=contentDetails&playlistId=${plId}&maxResults=${UPLOADS_SCAN_MAX}&key=${key}`);
  if(!data) return null;
  return (data.items || []).map(it => it.contentDetails && it.contentDetails.videoId).filter(Boolean);
}

// search.list?eventType=live — the eventually-consistent live index. 100 units.
// Used only as an on-demand backstop for a single channel, never in bulk.
async function fetchLiveSearchIds(channelId){
  const key = getApiKey();
  if(!key) return null;
  const data = await ytApiGet(`https://www.googleapis.com/youtube/v3/search?part=id&channelId=${channelId}&eventType=live&type=video&order=date&maxResults=5&key=${key}`);
  if(!data) return null;
  return (data.items || []).map(it => it.id && it.id.videoId).filter(Boolean);
}

// videos.list -> classifyVideo() for each id (region-aware). 1 unit per 50 ids.
// Returns { [id]: classified } or null if every batch request failed.
async function classifyVideos(ids){
  const uniq = [...new Set((ids || []).filter(Boolean))];
  if(!uniq.length) return {};
  const key = getApiKey();
  if(!key) return {};
  const region = getRegion();
  const out = {};
  let anyOk = false;
  for(const group of chunk(uniq, VIDEOS_BATCH_SIZE)){
    const data = await ytApiGet(`https://www.googleapis.com/youtube/v3/videos?part=${VIDEO_PARTS}&id=${group.join(",")}&key=${key}`);
    if(!data){ continue; }
    anyOk = true;
    const byId = {};
    (data.items || []).forEach(it => { byId[it.id] = it; });
    group.forEach(id => { out[id] = YTC.classifyVideo(byId[id] || null, { region }); });
  }
  return anyOk ? out : null;
}

function isFresh(ch){
  const meta = getMeta(ch);
  if(!meta) return false;
  const ttl = meta.error ? ERROR_RETRY_TTL_MS : REFRESH_TTL_MS;
  return (Date.now() - meta.checkedAt) < ttl;
}

function saveMeta(ch, patch){
  metaStore.set(ch.handle, Object.assign({ checkedAt: Date.now() }, patch));
}
// Keep any cached recent[] on a transient failure so the card can still fall
// back to recent videos instead of going blank.
function saveErrorMeta(ch){
  const prev = getMeta(ch) || {};
  metaStore.set(ch.handle, {
    checkedAt: Date.now(), state: "error", error: true,
    recent: prev.recent || [], primaryVideoId: prev.primaryVideoId || null, liveVideoId: null,
  });
}

// The discovery hierarchy for one channel. Persists the result to metaStore
// and returns it. `allowSearch` enables the 100-unit live-search backstop
// (single-channel clicks only — never bulk "Fetch All").
async function discoverChannel(ch, opts){
  opts = opts || {};
  if(isQuotaExceeded() || isApiKeyInvalid()) return getMeta(ch);

  const manual = getManualVideo(ch);
  const channelId = await resolveChannelId(ch);
  if(isQuotaExceeded() || isApiKeyInvalid()) return getMeta(ch);

  // Gather candidate ids: manual override + recent uploads (+ live search backstop).
  let uploadIds = null;
  if(channelId) uploadIds = await fetchUploadIds(channelId);
  if(isQuotaExceeded() || isApiKeyInvalid()) return getMeta(ch);

  if(!manual && !channelId && uploadIds === null){
    saveErrorMeta(ch);
    return getMeta(ch);
  }

  let candidateIds = [];
  if(manual) candidateIds.push(manual);
  if(Array.isArray(uploadIds)) candidateIds = candidateIds.concat(uploadIds);

  let classified = await classifyVideos(candidateIds);
  if(isQuotaExceeded() || isApiKeyInvalid()) return getMeta(ch);
  if(classified === null){ saveErrorMeta(ch); return getMeta(ch); }

  const haveLiveOrUpcoming = Object.keys(classified).some(id => {
    const c = classified[id]; return c && (c.state === "live" || c.state === "upcoming");
  });

  // Backstop: the uploads scan found nothing live/upcoming — try the pricey
  // live-search index once (it sometimes has a stream the playlist doesn't).
  // Skipped for "regular" channels: they don't livestream, so the 100-unit
  // search would only ever burn quota. Their recent uploads are still scanned.
  if(opts.allowSearch && !haveLiveOrUpcoming && channelId
     && ch.liveBehavior !== "recent" && ch.type !== "regular"
     && !isQuotaExceeded() && !isApiKeyInvalid()){
    const liveIds = await fetchLiveSearchIds(channelId);
    if(Array.isArray(liveIds) && liveIds.length){
      const extra = await classifyVideos(liveIds);
      if(extra) classified = Object.assign({}, classified, extra);
      candidateIds = candidateIds.concat(liveIds);
    }
  }

  // Fresh discovery run — give any previously session-blocked candidate another
  // chance (the stream may have changed). onError re-blocks instantly if still bad.
  clearBlockedFor(candidateIds);

  const classifiedList = candidateIds
    .filter((id, i) => candidateIds.indexOf(id) === i)
    .map(id => classified[id])
    .filter(Boolean);

  if(manual){
    const mc = classified[manual];   // undefined if we couldn't classify (no key / API blip)
    const recent = classifiedList
      .filter(c => c.id !== manual && (c.state === "video" || c.state === "ended"))
      .slice(0, RECENT_GRID_MAX)
      .map(c => ({ id: c.id, title: c.title }));
    const state = !mc ? "manual"
                : mc.state === "unavailable" ? "manual_unavailable"
                : mc.state === "live" ? "manual_live" : "manual";
    saveMeta(ch, {
      source: "manual", state,
      primaryVideoId: manual,
      liveVideoId: mc && mc.state === "live" ? manual : null,
      recent,
    });
    return getMeta(ch);
  }

  const picked = YTC.pickPrimary(classifiedList);
  saveMeta(ch, {
    source: "auto",
    state: picked.state,
    primaryVideoId: picked.primaryVideoId,
    liveVideoId: picked.liveVideoId,
    startsAt: picked.startsAt || null,
    recent: (picked.recent || []).slice(0, RECENT_GRID_MAX),
  });
  return getMeta(ch);
}

function setStatus(text){ document.getElementById("statusline").textContent = text; }

async function refreshAll(force){
  const key = getApiKey();
  if(!key) return;
  if(isQuotaExceeded()){
    setStatus("Daily API quota reached — try again after it resets (midnight Pacific time).");
    return;
  }
  if(isApiKeyInvalid()){
    setStatus("Your YouTube API key looks invalid — check config.js or the 🔑 button.");
    return;
  }
  const last = Number(localStorage.getItem(LAST_FULL_REFRESH_KEY) || 0);
  if(!force && Date.now() - last < REFRESH_TTL_MS) return;

  const fetchAllBtn = document.getElementById("fetchAllBtn");
  fetchAllBtn.disabled = true;

  // Phase 1: one cheap bulk videos.list (1 unit / 50 ids) over every video id
  // we already know — each channel's last known live/primary video plus every
  // MANUAL override. Re-classify in place. Manual overrides are NEVER deleted
  // here; a dead one just gets state "manual_unavailable" so the row can offer
  // Update / Clear.
  const known = [];
  getAllChannels().forEach(ch => {
    const meta = getMeta(ch);
    [meta && meta.liveVideoId, meta && meta.primaryVideoId, getManualVideo(ch)]
      .filter(Boolean).forEach(id => known.push({ ch, id, manual: id === getManualVideo(ch) }));
  });
  for(const group of chunk(known, VIDEOS_BATCH_SIZE)){
    if(isQuotaExceeded() || isApiKeyInvalid()) break;
    setStatus(`Rechecking ${group.length} known video${group.length === 1 ? "" : "s"}…`);
    const cls = await classifyVideos(group.map(g => g.id));
    if(!cls) continue; // request failed; Phase 2 will retry these channels
    const touched = new Set();
    group.forEach(({ ch, id, manual }) => {
      if(touched.has(ch.handle)) return;
      const c = cls[id];
      if(!c) return;
      touched.add(ch.handle);
      if(manual){
        saveMeta(ch, Object.assign({}, getMeta(ch), {
          source: "manual",
          state: c.state === "unavailable" ? "manual_unavailable" : c.state === "live" ? "manual_live" : "manual",
          primaryVideoId: id, liveVideoId: c.state === "live" ? id : null, error: false,
        }));
      } else if(c.state === "live" && c.embeddable && !c.regionBlocked){
        saveMeta(ch, Object.assign({}, getMeta(ch), { state: "live", liveVideoId: id, primaryVideoId: id, error: false }));
      } else if(c.state === "live"){
        saveMeta(ch, Object.assign({}, getMeta(ch), {
          state: c.regionBlocked ? "region_blocked" : "embed_disabled", liveVideoId: id, error: false,
        }));
      } else {
        // The known live/primary ended — clear it so Phase 2 rediscovers.
        const prev = getMeta(ch) || {};
        if(prev.liveVideoId === id || prev.state === "live" || prev.state === "region_blocked" || prev.state === "embed_disabled"){
          metaStore.remove(ch.handle);
        }
      }
      updateChannelRow(ch);
    });
  }

  // Phase 2: cheap per-channel discovery (resolve handle + uploads scan +
  // videos.list — ~2 units each, NO 100-unit live search) for channels that
  // are still stale. New channels, or ones whose known video just ended.
  const needsDiscovery = getAllChannels().filter(ch => !isFresh(ch));
  for(let i = 0; i < needsDiscovery.length; i++){
    if(isQuotaExceeded() || isApiKeyInvalid()) break;
    const ch = needsDiscovery[i];
    setStatus(`Checking ${i + 1}/${needsDiscovery.length}: ${ch.name}`);
    await discoverChannel(ch, { allowSearch: false });
    updateChannelRow(ch);
    await sleep(120); // gentle pacing, not a hammering loop
  }

  fetchAllBtn.disabled = false;
  if(isQuotaExceeded()){
    setStatus("Daily API quota reached — try again after it resets (midnight Pacific time).");
  } else if(isApiKeyInvalid()){
    setStatus("Your YouTube API key looks invalid — check config.js or the 🔑 button.");
  } else {
    localStorage.setItem(LAST_FULL_REFRESH_KEY, String(Date.now()));
    setStatus("Channel list up to date.");
    setTimeout(() => { if(document.getElementById("statusline").textContent === "Channel list up to date.") setStatus(""); }, 4000);
  }
}

function promptApiKey(){
  if(apiKeyFromConfig()){
    alert(`Your API key is currently loaded from config.js, which takes priority over this prompt.\n\nTo change it, edit the YOUTUBE_API_KEY value in config.js directly (see the comment at the top of that file for setup instructions).`);
    return;
  }
  const help =
`Set your free YouTube Data API key:

1. This will open Google Cloud Console's credentials page.
2. Create a project if you don't have one (free, no card needed).
3. Enable "YouTube Data API v3" for it.
4. Create an API key and copy it.
5. Paste it into the next prompt.

Tip: instead of this prompt, you can also create a config.js file
next to index.html — see config.js for the one-line format. That
way the key persists even if you clear your browser's localStorage.

Click OK to open the credentials page now.`;
  if(confirm(help)){
    window.open("https://console.cloud.google.com/apis/credentials", "_blank", "noopener");
  }
  const key = prompt("Paste your YouTube Data API key:", getApiKey());
  if(key === null) return;
  if(key.trim()){
    localStorage.setItem(API_KEY_STORAGE, key.trim());
    refreshAll(true);
  } else {
    localStorage.removeItem(API_KEY_STORAGE);
  }
}

// ---------------------------------------------------------------
// Rendering. The nav is built once; per-channel state changes (live
// status flipping, a video ID being set) update just that row in
// place via updateChannelRow(), instead of tearing down and rebuilding
// the whole list — which used to happen on every single channel during
// "Fetch All" and reset the user's scroll position each time.
// ---------------------------------------------------------------
function getBadge(ch){
  const meta = getMeta(ch);
  const manual = getManualVideo(ch);
  const st = meta && meta.state;
  if(manual){
    if(st === "manual_unavailable") return { cls: "error", text: "manual", title: "Saved video is unavailable — Update or Clear it" };
    if(st === "manual_live" || st === "live") return { cls: "live", text: "manual", title: "Manual override — currently live" };
    return { cls: "manual", text: "manual", title: "Manual override" };
  }
  if(!meta){
    return getId(ch)
      ? { cls: "auto", text: "auto", title: "Auto-detect, not checked yet" }
      : { cls: "", text: "not set", title: "" };
  }
  switch(st){
    case "live":           return { cls: "live",    text: "live",      title: "" };
    case "region_blocked": return { cls: "blocked", text: "blocked",   title: "Live, but unavailable in your region — showing recent videos" };
    case "embed_disabled": return { cls: "blocked", text: "blocked",   title: "Live, but embedding is disabled — showing recent videos" };
    case "upcoming":       return { cls: "soon",    text: "soon",      title: "Upcoming live stream" };
    case "offline":        return { cls: "recent",  text: "recent",    title: "Not live — showing recent videos" };
    case "empty":          return { cls: "error",   text: "no videos", title: "No videos found for this channel" };
    case "error":          return { cls: "error",   text: "error",     title: "Last check failed — will retry automatically" };
  }
  // legacy meta shape { live: bool }
  if(meta.error) return { cls: "error", text: "error", title: "Last check failed — will retry automatically" };
  if(meta.live === true) return { cls: "live", text: "live", title: "" };
  if(meta.live === false) return { cls: "recent", text: "recent", title: "Not live — showing recent videos" };
  return getId(ch) ? { cls: "auto", text: "auto", title: "" } : { cls: "", text: "not set", title: "" };
}

function cssEscapeHandle(handle){
  return window.CSS && CSS.escape ? CSS.escape(handle) : handle.replace(/["\\]/g, "\\$&");
}

function findRow(ch){
  return document.querySelector(`.channel[data-handle="${cssEscapeHandle(ch.handle)}"]`);
}

function updateChannelRow(ch){
  const row = findRow(ch);
  if(!row) return;
  const badge = getBadge(ch);
  const badgeEl = row.querySelector(".badge");
  badgeEl.className = `badge${badge.cls ? " " + badge.cls : ""}`;
  badgeEl.textContent = badge.text;
  badgeEl.title = badge.title;
  row.querySelector(".fixbtn").textContent = getManualVideo(ch) ? "Update" : "Set Video";
}

function setActiveRow(ch){
  document.querySelectorAll(".channel.active").forEach(r => r.classList.remove("active"));
  const row = findRow(ch);
  if(row) row.classList.add("active");
}

// The sidebar has two top-level categories, each derived from a channel's
// `type` field, with the existing `group` values as sub-headings nested under
// them (first-appearance order within a category, as before).
const CATEGORY_ORDER = ["Live Streams", "News & Documentaries"];
const categoryOf = ch => ch.type === "regular" ? "News & Documentaries" : "Live Streams";

function render(){
  const navList = document.getElementById("navList");
  navList.innerHTML = "";
  const frag = document.createDocumentFragment();
  CATEGORY_ORDER.forEach(cat => {
    const inCat = getAllChannels().filter(c => categoryOf(c) === cat);
    if(!inCat.length) return;
    const catEl = document.createElement("div");
    catEl.className = "category-title";
    catEl.textContent = cat;
    frag.appendChild(catEl);
    const groups = [...new Set(inCat.map(c => c.group))];
    groups.forEach(g => {
      const h = document.createElement("div");
      h.className = "group-title";
      h.textContent = g;
      frag.appendChild(h);
      inCat.filter(c => c.group === g).forEach(ch => {
        const row = document.createElement("div");
        row.className = "channel";
        row.dataset.handle = ch.handle;
        row.dataset.name = `${ch.name} ${ch.handle}`.toLowerCase();
        if(ch.rtl) row.setAttribute("dir", "rtl");
        const hasManual = !!getManualVideo(ch);
        const badge = getBadge(ch);

        row.innerHTML = `
          <div class="name">${ch.name}<small>@${ch.handle}</small></div>
          <span style="display:flex;align-items:center;gap:6px;flex-shrink:0">
            <span class="badge${badge.cls ? " " + badge.cls : ""}" title="${badge.title}">${badge.text}</span>
            <button class="fixbtn">${hasManual ? "Update" : "Set Video"}</button>${isUserAdded(ch) ? '<button class="rmbtn" title="Remove this channel">✕</button>' : ""}
          </span>
        `;
        row.addEventListener("click", (e) => {
          if(e.target.closest(".fixbtn") || e.target.closest(".rmbtn")) return; // handled separately
          playChannel(ch);
        });
        row.querySelector(".fixbtn").addEventListener("click", (e) => {
          e.stopPropagation();
          openManualPopover(ch, e.currentTarget);
        });
        if(isUserAdded(ch)){
          row.querySelector(".rmbtn").addEventListener("click", (e) => {
            e.stopPropagation();
            removeUserChannel(ch);
          });
        }
        frag.appendChild(row);
      });
    });
  });
  navList.appendChild(frag);
  applyChannelFilter();
}

function applyChannelFilter(){
  const input = document.getElementById("channelSearch");
  const q = input ? input.value.trim().toLowerCase() : "";
  const navList = document.getElementById("navList");
  let currentCat = null;
  let catHasVisible = false;
  let currentHeader = null;
  let groupHasVisible = false;
  let anyVisible = false;
  const finalizeGroup = () => { if(currentHeader) currentHeader.hidden = !groupHasVisible; };
  const finalizeCat = () => { if(currentCat) currentCat.hidden = !catHasVisible; };
  navList.querySelectorAll(".category-title, .group-title, .channel").forEach(el => {
    if(el.classList.contains("category-title")){
      finalizeGroup(); finalizeCat();
      currentCat = el; catHasVisible = false;
      currentHeader = null; groupHasVisible = false;
    } else if(el.classList.contains("group-title")){
      finalizeGroup();
      currentHeader = el;
      groupHasVisible = false;
    } else {
      const visible = !q || el.dataset.name.includes(q);
      el.hidden = !visible;
      if(visible){ groupHasVisible = true; catHasVisible = true; anyVisible = true; }
    }
  });
  finalizeGroup(); finalizeCat();
  let noResults = document.getElementById("noResults");
  if(q && !anyVisible){
    if(!noResults){
      noResults = document.createElement("div");
      noResults.id = "noResults";
      noResults.className = "no-results";
      navList.appendChild(noResults);
    }
    noResults.textContent = `No channels match "${input.value.trim()}".`;
  } else if(noResults){
    noResults.remove();
  }
}

function escapeHtml(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}
function fmtTime(iso){
  try{ const d = new Date(iso); return isNaN(d.getTime()) ? "" : d.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }); }
  catch(e){ return ""; }
}

// ---------------------------------------------------------------
// Manual-override popover. Unobtrusive: opened from a row's "Set Video" /
// "Update" button or the toolbar "Manual video" link. Accepts a YouTube URL
// or a bare 11-char id; "Clear override" removes it so auto-detect resumes.
// Stored in videoIdStore (localStorage) — the project's existing mechanism.
// ---------------------------------------------------------------
let manualPopoverCh = null;
function openManualPopover(ch, anchorEl){
  manualPopoverCh = ch;
  const pop = document.getElementById("manualPopover");
  const backdrop = document.getElementById("mpopBackdrop");
  const input = document.getElementById("mpopInput");
  const err = document.getElementById("mpopErr");
  const sub = document.getElementById("mpopSub");
  const clearBtn = document.getElementById("mpopClear");
  const existing = getManualVideo(ch);
  sub.textContent = existing
    ? `Currently overriding auto-detect for “${ch.name}”.`
    : `Play a specific video for “${ch.name}”. This overrides automatic live detection.`;
  input.value = existing || "";
  err.hidden = true; err.textContent = "";
  clearBtn.hidden = !existing;
  pop.hidden = false; backdrop.hidden = false;
  positionManualPopover(pop, anchorEl);
  input.focus(); input.select();
}
function positionManualPopover(pop, anchorEl){
  if(window.innerWidth <= 720 || !anchorEl){
    pop.style.left = "50%"; pop.style.top = "50%"; pop.style.transform = "translate(-50%,-50%)";
    return;
  }
  pop.style.transform = "none";
  const r = anchorEl.getBoundingClientRect();
  const pw = Math.min(420, window.innerWidth - 32);
  let left = Math.max(12, Math.min(r.left, window.innerWidth - pw - 12));
  let top = r.bottom + 8;
  const ph = pop.offsetHeight || 200;
  if(top + ph > window.innerHeight - 12) top = Math.max(12, r.top - ph - 8);
  pop.style.left = left + "px"; pop.style.top = top + "px";
}
function closeManualPopover(){
  document.getElementById("manualPopover").hidden = true;
  document.getElementById("mpopBackdrop").hidden = true;
  manualPopoverCh = null;
}
function saveManualPopover(){
  const ch = manualPopoverCh; if(!ch) return;
  const err = document.getElementById("mpopErr");
  const id = extractVideoId(document.getElementById("mpopInput").value || "");
  if(!id){
    err.textContent = "Couldn't find a YouTube video ID in that. Paste a full link (youtu.be/…, watch?v=…, /live/…) or the 11-character ID.";
    err.hidden = false;
    return;
  }
  videoIdStore.set(ch.handle, id);
  metaStore.remove(ch.handle);   // drop stale auto status — discovery re-runs on play
  clearBlockedFor([id]);
  updateChannelRow(ch);
  closeManualPopover();
  playChannel(ch);
}
function clearManualPopover(){
  const ch = manualPopoverCh; if(!ch) return;
  videoIdStore.remove(ch.handle);
  metaStore.remove(ch.handle);   // auto-detect resumes on next play
  updateChannelRow(ch);
  closeManualPopover();
  playChannel(ch);
}

// ---------------------------------------------------------------
// Add Channel dialog ("+ Add Channel").
//
// Accepts a channel URL, @handle URL / bare handle, or UC… channel ID;
// resolves it via channels.list (1 quota unit, same ytApiGet plumbing as
// the rest of the app); previews the resolved channel; on confirm persists
// it to USER_CHANNELS_KEY and re-renders. The new row then flows through
// the standard discover/play/manual/embed pipeline untouched.
// Error semantics stay distinct: invalid input vs not-found vs API/quota/
// network failure vs duplicate — a failed lookup is never "not found".
// ---------------------------------------------------------------
let pendingAdd = null;   // { id, handle, title, thumb } awaiting confirmation
let addChLookupToken = 0;   // bumped on open/close/lookup so a stale async result bails out (same pattern as playToken)
async function resolveChannelReference(ref){
  const key = getApiKey();
  if(!key) return { status: "no-key" };
  const params = ref.kind === "id"
    ? `id=${encodeURIComponent(ref.value)}`
    : `forHandle=${encodeURIComponent(ref.value)}`;
  const data = await ytApiGet(`https://www.googleapis.com/youtube/v3/channels?part=id,snippet&${params}&key=${key}`);
  if(!data){
    if(isQuotaExceeded()) return { status: "quota" };
    if(isApiKeyInvalid()) return { status: "bad-key" };
    return { status: "network" };
  }
  const item = data.items && data.items[0];
  if(!item) return { status: "not-found" };
  const snip = item.snippet || {};
  const customUrl = typeof snip.customUrl === "string" && snip.customUrl.charAt(0) === "@"
    ? snip.customUrl.slice(1) : null;
  const thumbs = snip.thumbnails || {};
  return {
    status: "ok",
    id: item.id,
    title: snip.title || ref.value,
    handle: customUrl || (ref.kind === "handle" ? ref.value : "channel-" + String(item.id).slice(2, 10).toLowerCase()),
    thumb: (thumbs.default && thumbs.default.url) || (thumbs.medium && thumbs.medium.url) || null,
  };
}
function addChShowError(msg){
  const err = document.getElementById("addChErr");
  if(!msg){ err.hidden = true; err.textContent = ""; return; }
  err.textContent = msg;
  err.hidden = false;
}
function addChSetBusy(busy){
  document.getElementById("addChResolve").disabled = busy;
  document.getElementById("addChConfirm").disabled = busy;
  document.getElementById("addChInput").disabled = busy;
}
function openAddChannel(){
  pendingAdd = null;
  addChLookupToken++;
  document.getElementById("addChInput").value = "";
  document.getElementById("addChPreview").hidden = true;
  document.getElementById("addChDup").hidden = true;
  document.getElementById("addChConfirm").hidden = true;
  addChShowError(null);
  addChSetBusy(false);
  document.getElementById("addChannelPopover").hidden = false;
  document.getElementById("addChBackdrop").hidden = false;
  const input = document.getElementById("addChInput");
  input.focus(); input.select();
}
function closeAddChannel(){
  addChLookupToken++;
  document.getElementById("addChannelPopover").hidden = true;
  document.getElementById("addChBackdrop").hidden = true;
  pendingAdd = null;
}
async function lookupAddChannel(){
  const raw = document.getElementById("addChInput").value || "";
  document.getElementById("addChPreview").hidden = true;
  document.getElementById("addChDup").hidden = true;
  document.getElementById("addChConfirm").hidden = true;
  pendingAdd = null;
  const ref = YTC.parseChannelReference(raw);
  if(!ref){
    addChShowError("That doesn't look like a channel link, @handle, or channel ID. Paste a channel URL, @handle, or UC… ID — not a video link.");
    return;
  }
  if(ref.kind === "unsupported"){
    addChShowError("Custom channel URLs (/c/… or /user/…) can't be resolved automatically — use the @handle or the UC… channel ID instead.");
    return;
  }
  addChShowError(null);
  addChSetBusy(true);
  document.getElementById("addChResolve").textContent = "Looking up…";
  const myLookup = ++addChLookupToken;
  const res = await resolveChannelReference(ref);
  if(myLookup !== addChLookupToken) return;   // superseded by a newer lookup / close / reopen
  document.getElementById("addChResolve").textContent = "Look up";
  addChSetBusy(false);
  if(res.status === "no-key"){
    addChShowError("Set a free YouTube API key first (🔑 button above, or via config.js), then look up the channel again.");
    return;
  }
  if(res.status === "quota"){
    addChShowError("Today's YouTube API quota is used up — try again after it resets (midnight Pacific time). Nothing was added.");
    return;
  }
  if(res.status === "bad-key"){
    addChShowError("Your YouTube API key looks invalid — fix it via the 🔑 button or config.js, then try again. Nothing was added.");
    return;
  }
  if(res.status === "network"){
    addChShowError("Couldn't reach YouTube (network or API error) — try again. This doesn't mean the channel doesn't exist; nothing was added.");
    return;
  }
  if(res.status === "not-found"){
    addChShowError("No YouTube channel was found for that reference. Check the link, @handle, or channel ID and try again.");
    return;
  }
  const dupe = YTC.findChannelDuplicate(res.id, res.handle, getAllChannels());
  document.getElementById("addChName").textContent = res.title;
  document.getElementById("addChSub").textContent = `@${res.handle} · ${res.id}`;
  const thumb = document.getElementById("addChThumb");
  if(res.thumb){ thumb.src = res.thumb; thumb.hidden = false; } else { thumb.hidden = true; }
  document.getElementById("addChPreview").hidden = false;
  if(dupe){
    const dupEl = document.getElementById("addChDup");
    dupEl.textContent = `Already in your list as “${dupe.name}” — adding it again would create a duplicate.`;
    dupEl.hidden = false;
    return;
  }
  pendingAdd = res;
  document.getElementById("addChConfirm").hidden = false;
  document.getElementById("addChConfirm").focus();
}
function confirmAddChannel(){
  if(!pendingAdd) return;
  const dupe = YTC.findChannelDuplicate(pendingAdd.id, pendingAdd.handle, getAllChannels());
  if(dupe){
    const dupEl = document.getElementById("addChDup");
    dupEl.textContent = `Already in your list as “${dupe.name}” — adding it again would create a duplicate.`;
    dupEl.hidden = false;
    document.getElementById("addChConfirm").hidden = true;
    pendingAdd = null;
    return;
  }
  const row = {
    group: USER_CHANNEL_GROUP, type: "live",
    name: pendingAdd.title, handle: pendingAdd.handle, id: pendingAdd.id,
    userAdded: true, addedAt: Date.now(),
  };
  // Defensive: the resolved handle comes from the API (customUrl) — if it
  // ever fails the row contract, refuse rather than claim success while
  // sanitizeUserChannels() silently drops it on save.
  if(!YTC.isUserChannel(row)){
    addChShowError("YouTube returned an unexpected channel reference that can't be stored. Nothing was added.");
    pendingAdd = null;
    return;
  }
  const next = loadUserChannels().concat([row]);
  saveUserChannels(YTC.sanitizeUserChannels(next));
  const added = findChannelByHandle(row.handle);
  closeAddChannel();
  // A filter that would hide the new row is cleared so the addition is visible.
  const search = document.getElementById("channelSearch");
  if(search && search.value){ search.value = ""; }
  render();
  setStatus(`Added “${row.name}” to ${USER_CHANNEL_GROUP}.`);
  setTimeout(() => { if(document.getElementById("statusline").textContent.startsWith("Added “")) setStatus(""); }, 4000);
  if(added) playChannel(added);   // standard check-on-click discovery + fallback pipeline
}
function removeUserChannel(ch){
  if(!isUserAdded(ch)) return;
  if(!confirm(`Remove “${ch.name}” (@${ch.handle}) from your channels?\n\nIts manual override and cached status will be cleared too.`)) return;
  saveUserChannels(loadUserChannels().filter(c => !(c.id && ch.id ? c.id === ch.id : String(c.handle).toLowerCase() === String(ch.handle).toLowerCase())));
  metaStore.remove(ch.handle);
  videoIdStore.remove(ch.handle);
  if(currentChannel && String(currentChannel.handle).toLowerCase() === String(ch.handle).toLowerCase()) currentChannel = null;
  render();
  setStatus(`Removed “${ch.name}”.`);
  setTimeout(() => { if(document.getElementById("statusline").textContent.startsWith("Removed “")) setStatus(""); }, 4000);
}

// ---------------------------------------------------------------
// YouTube IFrame Player API (per Google's docs: developers.google.com/youtube/iframe_api_reference)
//
// IMPORTANT: this page must be served over http(s), not opened as a
// file:// URL. YouTube's embed player now requires an HTTP Referer
// header (see "Error 153" in the API's revision history, July 2025);
// file:// pages never send one, so every channel would fail to load
// no matter what. Run a tiny local server from this folder, e.g.:
//   python3 -m http.server 8000
// then open http://localhost:8000 in your browser.
// ---------------------------------------------------------------
let ytApiPromise = null;
function loadYtApi(){
  if(ytApiPromise) return ytApiPromise;
  ytApiPromise = new Promise((resolve) => {
    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);
    window.onYouTubeIframeAPIReady = () => resolve();
  });
  return ytApiPromise;
}

const ERROR_MESSAGES = {
  2:   "Invalid channel/video ID.",
  5:   "This stream can't be played in this player (HTML5 error).",
  100: "That channel or video couldn't be found.",
  101: "This video can't be played here — embedding is disabled by the broadcaster, or it's unavailable in your region.",
  150: "This video can't be played here — embedding is disabled by the broadcaster, or it's unavailable in your region.",
  153: "YouTube rejected the request (missing Referer header). Make sure you're opening this page via http://localhost, not by double-clicking the file.",
};

let currentPlayer = null;
let currentChannel = null;   // channel in the main player — used by the toolbar "Manual video" link
let playToken = 0;           // bumped on every playChannel() so stale async callbacks bail out

const mainCol = () => document.getElementById("mainCol");
const LIVE_STATES = { live: 1, manual_live: 1 };

function setLiveStrip(state, ch, startsAt){
  const strip = document.getElementById("liveStrip");
  let cls = "plain", txt = `Latest from ${ch.name}`;
  switch(state){
    case "live": case "manual_live": cls = "live"; txt = "LIVE"; break;
    case "region_blocked": cls = "blocked"; txt = "LIVE — unavailable in your region"; break;
    case "embed_disabled": cls = "blocked"; txt = "LIVE — embedding disabled by the broadcaster"; break;
    case "upcoming": cls = "soon"; txt = startsAt ? `Upcoming — starts ${fmtTime(startsAt)}` : "Upcoming live stream"; break;
    case "manual": cls = "plain"; txt = "Manual video"; break;
    case "manual_unavailable": cls = "blocked"; txt = "Saved manual video is unavailable"; break;
  }
  strip.className = `livestrip ${cls}`;
  strip.innerHTML = `<span class="dot"></span><span></span>`;
  strip.lastElementChild.textContent = txt;
  strip.hidden = false;
}

function renderRecentGrid(ch, recent, activeId){
  const grid = document.getElementById("recentGrid");
  const list = (recent || []).filter(v => v && v.id).slice(0, RECENT_GRID_MAX);
  grid.innerHTML = "";
  if(!list.length){ grid.hidden = true; mainCol().classList.remove("has-recent"); return; }
  list.forEach((v, i) => {
    const b = document.createElement("button");
    b.className = "rv-card";
    b.type = "button";
    if(v.id === activeId) b.setAttribute("aria-current", "true");
    const thumb = document.createElement("div");
    thumb.className = "rv-thumb";
    const img = document.createElement("img");
    img.loading = "lazy"; img.alt = "";
    img.src = `https://i.ytimg.com/vi/${v.id}/mqdefault.jpg`;
    thumb.appendChild(img);
    if(i === 0){
      const tag = document.createElement("span");
      tag.className = "rv-tag";
      tag.textContent = "● Latest";
      thumb.appendChild(tag);
    }
    const t = document.createElement("div");
    t.className = "rv-title";
    t.textContent = v.title || "Recent video";
    b.appendChild(thumb); b.appendChild(t);
    b.addEventListener("click", () => {
      grid.querySelectorAll(".rv-card").forEach(c => c.removeAttribute("aria-current"));
      b.setAttribute("aria-current", "true");
      mountPlayer(ch, v.id, "offline", { recent: list, token: playToken });
    });
    grid.appendChild(b);
  });
  grid.hidden = false;
  mainCol().classList.add("has-recent");
}

function nextPlayable(ids, exclude){
  return (ids || []).find(id => id && id !== exclude && !isBlocked(id)) || null;
}

function playerCard(ch, html){
  const liveUrl = `https://www.youtube.com/@${ch.handle}/live`;
  document.getElementById("playerWrap").innerHTML =
    `<div class="empty"><strong>${escapeHtml(ch.name)}</strong><br><br>${html}<br><br>
      <button class="hdrbtn" id="cardManualBtn" type="button">Set Live Video</button>
      &nbsp;<a href="${liveUrl}" target="_blank" rel="noopener" style="color:var(--accent)">Open on YouTube ↗</a></div>`;
  const b = document.getElementById("cardManualBtn");
  if(b) b.addEventListener("click", () => openManualPopover(ch, b));
  document.getElementById("toolbar").style.display = "flex";
  document.getElementById("openYoutube").href = liveUrl;
  document.getElementById("nowPlaying").textContent = ch.name;
  document.getElementById("recentGrid").hidden = true;
  document.getElementById("recentGrid").innerHTML = "";
  mainCol().classList.remove("has-recent");
  document.getElementById("liveStrip").hidden = true;
}

// Builds the <iframe> + YT.Player for one video and wires the fallback chain:
// a failed embed is blocklisted and the next recent video is tried automatically.
function mountPlayer(ch, videoId, state, ctx){
  ctx = ctx || {};
  const token = ctx.token != null ? ctx.token : playToken;
  const recent = ctx.recent || [];
  const recentIds = recent.map(v => v.id);
  const wrap = document.getElementById("playerWrap");
  const toolbar = document.getElementById("toolbar");
  const nowPlaying = document.getElementById("nowPlaying");
  const openLink = document.getElementById("openYoutube");
  const liveUrl = `https://www.youtube.com/@${ch.handle}/live`;

  if(!videoId){
    const alt = nextPlayable(recentIds, null);
    if(alt){ mountPlayer(ch, alt, state === "live" ? "offline" : state, { recent, token, startsAt: ctx.startsAt }); return; }
    playerCard(ch, "Couldn't find a playable video for this channel right now. Try again later, or set one manually.");
    return;
  }

  setLiveStrip(state, ch, ctx.startsAt);
  toolbar.style.display = "flex";
  nowPlaying.textContent = "Loading: " + ch.name;
  openLink.href = LIVE_STATES[state] ? liveUrl : `https://www.youtube.com/watch?v=${videoId}`;

  if(LIVE_STATES[state]) renderRecentGrid(ch, [], null);
  else renderRecentGrid(ch, recent, videoId);

  // Autoplay ONLY for a "live"-type channel that a check says is currently live
  // (LIVE_STATES covers "live" / "manual_live"). "regular" channels and any
  // recent-video / offline fallback load paused — playback needs a click.
  const wantAutoplay = !!LIVE_STATES[state] && ch.type === "live";
  const embedSrc = `https://www.youtube.com/embed/${videoId}?${wantAutoplay ? "autoplay=1&" : ""}enablejsapi=1&origin=${encodeURIComponent(location.origin)}`;
  wrap.innerHTML = `<iframe id="ytplayer" src="${embedSrc}" frameborder="0"
      allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    <div class="hint" id="playerHint"></div>`;
  const hint0 = document.getElementById("playerHint");
  if(hint0) hint0.textContent = `Loading “${ch.name}”…`;

  loadYtApi().then(() => {
    if(token !== playToken) return;
    if(currentPlayer && currentPlayer.destroy){ try{ currentPlayer.destroy(); }catch(e){} }
    currentPlayer = new YT.Player("ytplayer", {
      events: {
        onReady: () => {
          if(token !== playToken) return;
          nowPlaying.textContent = "Now playing: " + ch.name;
          const hint = document.getElementById("playerHint");
          if(hint) hint.classList.add("fade");
        },
        onError: (e) => {
          if(token !== playToken) return;
          const code = e.data;
          markBlocked(videoId, "err" + code);
          // A discovered LIVE video that won't embed -> relabel and drop to recent.
          let nextState = state;
          if(LIVE_STATES[state]) nextState = (code === 101 || code === 150) ? "region_blocked" : "embed_disabled";
          else if(nextState === "live") nextState = "offline";
          const fallbackId = nextPlayable(recentIds, videoId);
          if(fallbackId){
            mountPlayer(ch, fallbackId, nextState, { recent, token, startsAt: ctx.startsAt });
          } else {
            const msg = ERROR_MESSAGES[code] || `Playback error (code ${code}).`;
            playerCard(ch, `${msg}<br><br>No other recent video was available to fall back to.`);
          }
        }
      }
    });
  });
}

async function playChannel(ch){
  setActiveRow(ch);
  closeMobileNav();
  currentChannel = ch;
  const token = ++playToken;
  const wrap = document.getElementById("playerWrap");
  const toolbar = document.getElementById("toolbar");
  const statusline = document.getElementById("statusline");
  const strip = document.getElementById("liveStrip");

  if(location.protocol === "file:"){
    wrap.innerHTML = `<div class="empty">
      This page was opened as a local file, which YouTube's player will reject (missing Referer header → Error 153).<br><br>
      Run a tiny local server from this folder instead, e.g.:<br><br>
      <code style="background:#000;padding:4px 8px;border-radius:4px">python3 -m http.server 8000</code><br><br>
      then open <code style="background:#000;padding:4px 8px;border-radius:4px">http://localhost:8000</code> in your browser.
    </div>`;
    toolbar.style.display = "none";
    strip.hidden = true;
    document.getElementById("recentGrid").hidden = true;
    mainCol().classList.remove("has-recent");
    return;
  }

  const canApi = !!getApiKey() && !isQuotaExceeded() && !isApiKeyInvalid();

  // Check-on-click: only hit the API for the channel actually clicked, and only
  // if its cached status is stale (same 15-min TTL as "Fetch All").
  if(canApi && !isFresh(ch)){
    wrap.innerHTML = `<div class="empty">Checking “${escapeHtml(ch.name)}” for a live stream…</div>`;
    toolbar.style.display = "none";
    strip.hidden = true;
    document.getElementById("recentGrid").hidden = true;
    mainCol().classList.remove("has-recent");
    statusline.textContent = `Checking: ${ch.name}`;
    await discoverChannel(ch, { allowSearch: true });
    if(token !== playToken) return;      // user clicked another channel meanwhile
    updateChannelRow(ch);
    statusline.textContent = "";
  }

  const meta = getMeta(ch) || {};
  const manual = getManualVideo(ch);
  const recent = Array.isArray(meta.recent) ? meta.recent : [];
  const recentIds = recent.map(v => v.id);

  if(manual){
    const st = meta.state === "manual_live" ? "manual_live"
             : meta.state === "manual_unavailable" ? "manual_unavailable" : "manual";
    mountPlayer(ch, manual, st, { recent, token, startsAt: meta.startsAt });
    return;
  }

  if(!canApi && !meta.state){
    playerCard(ch, getApiKey()
      ? (isQuotaExceeded()
          ? `Today's YouTube API quota is used up, so this channel couldn't be checked. Recent videos will load once it resets (midnight Pacific), or set a video manually.`
          : `Your YouTube API key looks invalid, so this channel couldn't be checked. Fix it via the 🔑 button, or set a video manually.`)
      : `Set a free YouTube API key (🔑 button) to auto-detect live streams and recent videos, or set a specific video manually.`);
    return;
  }

  switch(meta.state){
    case "live": case "manual_live": {
      const liveId = meta.liveVideoId || meta.primaryVideoId;
      if(liveId && !isBlocked(liveId)){ mountPlayer(ch, liveId, "live", { recent, token }); return; }
      // live id known-broken this session -> fall through to recent
      mountPlayer(ch, nextPlayable(recentIds, null), "region_blocked", { recent, token });
      return;
    }
    case "region_blocked":
    case "embed_disabled":
    case "upcoming": {
      const pid = (meta.primaryVideoId && !isBlocked(meta.primaryVideoId)) ? meta.primaryVideoId : nextPlayable(recentIds, null);
      mountPlayer(ch, pid, meta.state, { recent, token, startsAt: meta.startsAt });
      return;
    }
    case "offline": {
      const pid = (meta.primaryVideoId && !isBlocked(meta.primaryVideoId)) ? meta.primaryVideoId : nextPlayable(recentIds, null);
      if(pid){ mountPlayer(ch, pid, "offline", { recent, token }); return; }
      playerCard(ch, `“${escapeHtml(ch.name)}” isn't live and has no recent public videos to show. Try again later, or set a video manually.`);
      return;
    }
    case "empty":
      playerCard(ch, `Couldn't find any videos for this channel — its handle may be wrong (<code>@${escapeHtml(ch.handle)}</code>), or it has no public uploads.`);
      return;
    case "error": {
      const pid = nextPlayable(recentIds, null);
      if(pid){ mountPlayer(ch, pid, "offline", { recent, token }); return; }
      playerCard(ch, `The last check for this channel failed (network issue, quota, or the handle couldn't be resolved). It'll retry automatically — or set a video manually.`);
      return;
    }
    default: {
      // no usable meta (e.g. legacy shape, or API disabled) — best effort
      const pid = nextPlayable(recentIds, null);
      if(pid){ mountPlayer(ch, pid, "offline", { recent, token }); return; }
      playerCard(ch, `Nothing to play for “${escapeHtml(ch.name)}” yet. Use "Fetch All" / click again to auto-detect, or set a video manually.`);
    }
  }
}

render();

// Group headers stick just below the search box (see .group-title CSS) —
// measure its real rendered height instead of guessing a fixed offset.
(function setGroupStickyOffset(){
  const navsearch = document.querySelector(".navsearch");
  if(navsearch) document.documentElement.style.setProperty("--navsearch-h", navsearch.offsetHeight + "px");
})();

// Sidebar collapse/expand — on mobile this is a full overlay drawer with a
// backdrop instead of pushing the player over, and closes itself once a
// channel is picked (see closeMobileNav(), called from playChannel).
const MOBILE_BREAKPOINT = 720;
let setNavCollapsed = () => {};
let closeMobileNav = () => {};
(function setupNavToggle(){
  const nav = document.getElementById("nav");
  const btn = document.getElementById("navToggle");
  const mobileBtn = document.getElementById("navToggleMobile");
  const backdrop = document.getElementById("navBackdrop");
  const COLLAPSE_KEY = "newstv_nav_collapsed";
  const isMobile = () => window.innerWidth <= MOBILE_BREAKPOINT;

  function applyState(collapsed){
    nav.classList.toggle("collapsed", collapsed);
    btn.classList.toggle("collapsed", collapsed);
    const title = collapsed ? "Show channel list" : "Hide channel list";
    btn.title = title;
    mobileBtn.title = title;
    backdrop.classList.toggle("show", isMobile() && !collapsed);
  }

  const stored = localStorage.getItem(COLLAPSE_KEY);
  // First-ever visit on a phone: default to collapsed so the player is visible immediately.
  applyState(stored !== null ? stored === "1" : isMobile());

  setNavCollapsed = (collapsed) => {
    applyState(collapsed);
    localStorage.setItem(COLLAPSE_KEY, collapsed ? "1" : "0");
  };
  closeMobileNav = () => { if(isMobile()) setNavCollapsed(true); };

  function toggle(){ setNavCollapsed(!nav.classList.contains("collapsed")); }
  btn.addEventListener("click", toggle);
  mobileBtn.addEventListener("click", toggle);
  backdrop.addEventListener("click", () => setNavCollapsed(true));
})();

// ---------------------------------------------------------------
// View switcher — "📺 Channels" / "🗺️ World Map" / "📰 Google News".
// The app had no tabs; this just toggles [hidden] on the view containers
// ([hidden] is forced to display:none in the CSS, so it beats their flex
// display). Each non-Channels UI is built lazily on first open
// (see lib/liveuamapExplorer.js, lib/googleNewsExplorer.js).
// ---------------------------------------------------------------
(function setupViewTabs(){
  const VIEW_KEY = "newstv_liveuamap_view"; // kept for back-compat; now also "news"
  const channelsView = document.getElementById("channelsView");
  const mapView = document.getElementById("liveuamapView");
  const newsView = document.getElementById("googleNewsView");
  // header controls that only make sense on the Channels view
  const channelOnly = ["statusline", "addChannelBtn", "fetchAllBtn", "apiKeyBtn", "navToggleMobile", "navToggle"]
    .map(id => document.getElementById(id)).filter(Boolean);

  const VIEWS = [
    { key: "channels", tab: document.getElementById("tabChannels"),   el: channelsView },
    { key: "map",      tab: document.getElementById("tabWorldMap"),   el: mapView,
      init: () => window.LiveuamapExplorer  && LiveuamapExplorer.init(mapView) },
    { key: "news",     tab: document.getElementById("tabGoogleNews"), el: newsView,
      init: () => window.GoogleNewsExplorer && GoogleNewsExplorer.init(newsView) },
  ];
  const built = new Set();

  function setView(key){
    if(!VIEWS.some(v => v.key === key)) key = "channels";
    VIEWS.forEach(v => {
      const on = v.key === key;
      v.el.hidden = !on;
      v.tab.classList.toggle("active", on);
      v.tab.setAttribute("aria-selected", String(on));
    });
    channelOnly.forEach(el => { el.hidden = key !== "channels"; });
    const active = VIEWS.find(v => v.key === key);
    if(active && active.init && !built.has(key)){
      built.add(key);
      active.init();
    }
    try{ localStorage.setItem(VIEW_KEY, key); }catch(e){}
  }

  VIEWS.forEach(v => v.tab.addEventListener("click", () => setView(v.key)));

  let start = "channels";
  try{
    const saved = localStorage.getItem(VIEW_KEY);
    if(VIEWS.some(v => v.key === saved)) start = saved;
  }catch(e){}
  setView(start);
})();

if(isQuotaExceeded()){

// No auto-refresh on load — default behavior is check-on-click (see playChannel).
// Use the "⟳ Fetch All" button when you want the whole list's live status at once.

// Warn immediately on load if opened as a local file, before the user even picks a channel.
(function checkProtocol(){
  const msg = document.getElementById("startupMsg");
  if(!msg) return;
  if(location.protocol === "file:"){
    msg.innerHTML = `⚠️ This page was opened directly from disk (file://).<br><br>
      YouTube's player rejects that (missing Referer header → Error 153), so no channel will load until you serve it over http.<br><br>
      From this folder, run:<br><br>
      <code style="background:#000;padding:4px 8px;border-radius:4px">python3 -m http.server 8000</code><br><br>
      then open <code style="background:#000;padding:4px 8px;border-radius:4px">http://localhost:8000</code> in your browser.`;
  } else if(apiKeyFromConfig()){
    msg.innerHTML = `Pick a channel on the left to start watching.<br><br>
      API key loaded from config.js — live status is checked automatically the first time you click each channel.`;
  } else {
    msg.innerHTML = `Pick a channel on the left to start watching.<br><br>
      Set a free YouTube API key (🔑 button above, or via config.js) to auto-detect live streams, or click "Set Video" next to a channel to set one manually.`;
  }
})();
